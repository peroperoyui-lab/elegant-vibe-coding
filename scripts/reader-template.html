<script>
'use strict';
const book=JSON.parse(document.getElementById('book-data').textContent);
const docs=book.documents,byId=new Map(docs.map(d=>[d.id,d]));
const $=id=>document.getElementById(id);
let current=null,toastTimer;
const saved={get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let bookmarks=new Set(saved.get('evc.bookmarks',[]));
const prefersDark=matchMedia('(prefers-color-scheme:dark)').matches;
function theme(value){document.documentElement.dataset.theme=value;$('theme-button').textContent=value==='dark'?'浅色':'深色';$('theme-button').setAttribute('aria-pressed',String(value==='dark'));saved.set('evc.theme',value)}
theme(saved.get('evc.theme',prefersDark?'dark':'light'));
function route(id,anchor='') {return '#'+new URLSearchParams({doc:id,...(anchor?{section:anchor}:{})})}
function nav(){const frag=document.createDocumentFragment();let group='';for(const d of docs){if(d.group!==group){const h=document.createElement('p');h.className='nav-group';h.textContent=d.group;frag.append(h);group=d.group}const a=document.createElement('a');a.className='nav-link';a.href=route(d.id);a.dataset.doc=d.id;a.append(document.createTextNode(d.label));if(bookmarks.has(d.id)){const star=document.createElement('span');star.className='nav-star';star.textContent='★';star.setAttribute('aria-label','已收藏');a.append(star)}if(current===d.id)a.setAttribute('aria-current','page');frag.append(a)}$('nav').replaceChildren(frag)}
function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function closeMenu(){const wasOpen=$('sidebar').classList.contains('open');$('sidebar').classList.remove('open');$('overlay').classList.remove('open');$('menu-button').setAttribute('aria-expanded','false');$('sidebar').removeAttribute('role');$('sidebar').removeAttribute('aria-modal');$('main').inert=false;$('sidebar').inert=matchMedia('(max-width:800px)').matches;if(wasOpen)$('menu-button').focus()}
function openMenu(){$('sidebar').inert=false;$('sidebar').classList.add('open');$('overlay').classList.add('open');$('sidebar').setAttribute('role','dialog');$('sidebar').setAttribute('aria-modal','true');$('menu-button').setAttribute('aria-expanded','true');$('main').inert=true;$('side-search').focus()}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;$('progress').style.width=(max>0?Math.min(100,scrollY/max*100):100)+'%'}
function render(){const shouldFocus=current!==null;const params=new URLSearchParams(location.hash.slice(1));const id=byId.has(params.get('doc'))?params.get('doc'):'README.md';const d=byId.get(id);current=id;$('content').innerHTML=d.html;document.title=d.title+' · Elegant Vibe Coding';$('crumb').textContent=d.group+' / '+d.label;$('chapter-meta').textContent=d.group.toUpperCase()+' · 约 '+d.minutes+' 分钟 · '+book.edition;$('source-link').href='https://github.com/peroperoyui-lab/elegant-vibe-coding/blob/main/'+id;$('bookmark-button').textContent=bookmarks.has(id)?'已收藏 ★':'收藏本章';$('bookmark-button').setAttribute('aria-pressed',String(bookmarks.has(id)));nav();const toc=document.createDocumentFragment();for(const h of d.headings){const a=document.createElement('a');a.textContent=h.text;a.href=route(id,h.anchor);a.dataset.doc=id;a.dataset.anchor=h.anchor;if(h.depth===3)a.className='sub';toc.append(a)}$('toc').replaceChildren(toc);$('chapter-end').replaceChildren();const i=docs.indexOf(d);for(const [next,label] of [[docs[i-1],'上一章'],[docs[i+1],'下一章']]){if(!next)continue;const b=document.createElement('button');b.dataset.doc=next.id;const small=document.createElement('small');small.textContent=label;const span=document.createElement('span');span.textContent=next.label;b.append(small,span);$('chapter-end').append(b)}closeMenu();requestAnimationFrame(()=>{const section=params.get('section');const target=section?document.getElementById(section):null;if(target)target.scrollIntoView({behavior:'instant',block:'start'});else window.scrollTo({top:0,behavior:'instant'});if(shouldFocus){const focusTarget=target||$('content');if(!focusTarget.hasAttribute('tabindex'))focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true})}updateProgress()})}
function go(id,anchor=''){if(!byId.has(id))return;const hash=route(id,anchor);if(location.hash===hash)render();else location.hash=hash}
function showDialog(id){for(const dialog of document.querySelectorAll('dialog[open]'))if(dialog.id!==id)dialog.close();if(!$(id).open)$(id).showModal()}
function openSearch(){closeMenu();showDialog('search-dialog');$('query').focus();search()}
function snippet(text,q){const lower=text.toLocaleLowerCase(),pos=lower.indexOf(q.toLocaleLowerCase());const start=Math.max(0,pos-42);return(start?'…':'')+text.slice(start,start+150).replace(/\s+/g,' ')+(start+150<text.length?'…':'')}
function highlight(el,text,query){if(!query){el.textContent=text;return}const lower=text.toLocaleLowerCase(),q=query.toLocaleLowerCase();let cursor=0,pos;while((pos=lower.indexOf(q,cursor))>=0){el.append(document.createTextNode(text.slice(cursor,pos)));const mark=document.createElement('mark');mark.textContent=text.slice(pos,pos+query.length);el.append(mark);cursor=pos+query.length}el.append(document.createTextNode(text.slice(cursor)))}
function search(){const q=$('query').value.trim();let results;if(!q){results=docs.filter(d=>['QUICKSTART.md','GLOSSARY.md','docs/workflow/02-prompt-recipes.md','docs/backend/02-review-in-30-minutes.md','docs/frontend/01-visual-language.md'].includes(d.id)).map(d=>({d,score:0}))}else{const words=q.toLocaleLowerCase().split(/\s+/);results=docs.map(d=>({d,score:words.every(w=>(d.title+' '+d.plain).toLocaleLowerCase().includes(w))?words.reduce((s,w)=>s+(d.title.toLocaleLowerCase().includes(w)?10:1),0):0})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}$('search-info').textContent=q?(results.length+' 个章节匹配；按章节列出最相关内容。'):'从常用入口开始，或输入关键词。';const frag=document.createDocumentFragment();for(const {d} of results.slice(0,40)){const b=document.createElement('button');b.className='search-result';b.type='button';const cat=document.createElement('small');cat.textContent=d.group;const title=document.createElement('strong');highlight(title,d.title,q);const p=document.createElement('p');highlight(p,snippet(d.plain,q),q);b.append(cat,title,p);b.addEventListener('click',()=>{$('search-dialog').close();go(d.id);setTimeout(()=>$('content').focus({preventScroll:true}),0)});frag.append(b)}$('search-results').replaceChildren(frag)}
async function copy(text){const trigger=document.activeElement;try{await navigator.clipboard.writeText(text);notify('已复制，可直接粘贴')}catch{const textarea=document.createElement('textarea');textarea.value=text;textarea.style.position='fixed';textarea.style.opacity='0';document.body.append(textarea);textarea.select();const ok=document.execCommand('copy');textarea.remove();trigger?.focus({preventScroll:true});notify(ok?'已复制，可直接粘贴':'浏览器未允许复制，请选中文本后复制')}}
function lab(){closeMenu();if(!$('lab-frame').srcdoc)$('lab-frame').srcdoc=book.lab;showDialog('lab-dialog')}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('content').focus({preventScroll:true});$('content').scrollIntoView({block:'start'});return}const close=e.target.closest('[data-close]');if(close){$(close.dataset.close).close();return}const target=e.target.closest('[data-doc]');if(target){e.preventDefault();go(target.dataset.doc,target.dataset.anchor||'');return}const c=e.target.closest('.copy-code');if(c){copy(c.closest('.code-wrap').querySelector('code').textContent);return}if(e.target.closest('[data-lab]')){lab();return}const img=e.target.closest('[data-image]');if(img&&book.images[img.dataset.image]){$('image-view').src=book.images[img.dataset.image];$('image-title').textContent=img.querySelector('img')?.alt||img.textContent||'手册图解';showDialog('image-dialog')}});
$('query').addEventListener('input',search);$('side-search').addEventListener('click',openSearch);$('search-button').addEventListener('click',openSearch);$('lab-button').addEventListener('click',lab);$('theme-button').addEventListener('click',()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark'));$('print-button').addEventListener('click',()=>print());$('menu-button').addEventListener('click',()=>{$('sidebar').classList.contains('open')?closeMenu():openMenu()});$('overlay').addEventListener('click',closeMenu);$('close-menu-button').addEventListener('click',closeMenu);
$('bookmark-button').addEventListener('click',()=>{if(bookmarks.has(current))bookmarks.delete(current);else bookmarks.add(current);saved.set('evc.bookmarks',[...bookmarks]);$('bookmark-button').textContent=bookmarks.has(current)?'已收藏 ★':'收藏本章';$('bookmark-button').setAttribute('aria-pressed',String(bookmarks.has(current)));nav();notify(bookmarks.has(current)?'已收藏本章':'已移除收藏')});
$('export-button').addEventListener('click',()=>{const d=byId.get(current);const url=URL.createObjectURL(new Blob([d.raw],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=d.id.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出本章 Markdown')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.isComposing){const dialog=document.querySelector('dialog[open]');if(dialog){e.preventDefault();dialog.close();return}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('search-dialog').open)openSearch()}if(e.key==='Escape'&&$('sidebar').classList.contains('open'))closeMenu();if(e.key==='Tab'&&$('sidebar').classList.contains('open')){const all=[...$('sidebar').querySelectorAll('a,button')].filter(el=>el.getClientRects().length);const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
addEventListener('message',event=>{if(event.source!==$('lab-frame').contentWindow||event.data?.type!=='evc:open-chapter'||!byId.has(event.data.id))return;$('lab-dialog').close();go(event.data.id)});
matchMedia('(max-width:800px)').addEventListener('change',closeMenu);addEventListener('hashchange',render);addEventListener('scroll',updateProgress,{passive:true});addEventListener('resize',updateProgress);render();
</script>
</body>
